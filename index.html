<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Robux Simulation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#222;display:flex;justify-content:space-between}
main{max-width:650px;margin:30px auto;padding:20px}
.card{background:#292929;border-radius:14px;padding:22px;margin-bottom:18px}
h1{font-size:26px}
input,button{padding:13px;border-radius:8px;border:0;font-size:16px}
input{width:100%;margin:10px 0;background:#eee;color:#111}
button{background:#00b83f;color:white;cursor:pointer;font-weight:bold}
.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover}
.result{display:none;margin-top:20px;padding:15px;background:#163d25;border-radius:10px}
.small{color:#bbb;font-size:13px}
</style>
</head>
<body>
<header>
<strong>◈ Roblox Simulation</strong>
<strong>🪙 <span id="balance">10000</span></strong>
</header>

<main>
<div class="card">
<h1>🎁 Send Fake Robux</h1>
<p>Simule un envoi de Robux sans transaction réelle.</p>

<label for="username">Nom d'utilisateur Roblox</label>
<input id="username" placeholder="Exemple : Builderman">

<button onclick="searchUser()">Rechercher le joueur</button>

<div id="profile" style="display:none;margin-top:20px">
<img id="avatar" class="avatar" alt="Avatar du joueur">
<h3 id="displayName"></h3>
<p id="userName"></p>

<label for="amount">Montant fictif</label>
<input id="amount" type="number" min="1" max="1000000" value="100">

<button onclick="sendFakeRobux()">Simuler l'envoi</button>
</div>

<div class="result" id="result" role="status"></div>
<p class="small">Démo non officielle. Aucun Robux réel n'est envoyé.</p>
</div>
</main>

<script>
let selectedUser = null;

async function searchUser(){
  const username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");
  result.style.display = "none";

  if(!username){
    alert("Entre un nom d'utilisateur.");
    return;
  }

  // API publique Roblox : recherche d'utilisateurs
  try{
    const response = await fetch(
      "https://users.roblox.com/v1/usernames/users",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          usernames:[username],
          excludeBannedUsers:false
        })
      }
    );

    if(!response.ok) throw new Error("Recherche indisponible");

    const data = await response.json();
    if(!data.data || !data.data.length){
      alert("Aucun joueur trouvé. Vérifie le nom.");
      return;
    }

    selectedUser = data.data[0];

    document.getElementById("displayName").textContent =
      selectedUser.displayName;
    document.getElementById("userName").textContent =
      "@" + selectedUser.name;

    const avatarResponse = await fetch(
      "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=" +
      selectedUser.id + "&size=150x150&format=Png&isCircular=true"
    );
    const avatarData = await avatarResponse.json();

    if(avatarData.data && avatarData.data[0]){
      document.getElementById("avatar").src =
        avatarData.data[0].imageUrl;
    }

    document.getElementById("profile").style.display = "block";
  }catch(error){
    alert("La recherche est indisponible. Réessaie plus tard.");
  }
}

function sendFakeRobux(){
  if(!selectedUser) return;

  const amount = Number(document.getElementById("amount").value);
  if(!Number.isInteger(amount) || amount < 1 || amount > 1000000){
    alert("Entre un montant entre 1 et 1 000 000.");
    return;
  }

  const result = document.getElementById("result");
  result.innerHTML = "";

  const title = document.createElement("h3");
  title.textContent = "✅ Simulation terminée";

  const details = document.createElement("p");
  details.textContent =
    amount.toLocaleString("fr-CA") +
    " faux Robux pour " + selectedUser.name;

  const notice = document.createElement("p");
  notice.textContent =
    "Aucun Robux réel n'a été transféré.";

  result.append(title, details, notice);
  result.style.display = "block";
}
</script>
</body>
</html>
